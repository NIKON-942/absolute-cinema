name: Dependency audit

on:
  pull_request:
    paths: ['**/package.json', '**/package-lock.json', '.github/workflows/dependency-audit.yml']
  push:
    branches: [dev, main]
    paths: ['**/package.json', '**/package-lock.json', '.github/workflows/dependency-audit.yml']
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Audit locked dependencies
        run: npm --prefix ${{ matrix.directory }} audit --audit-level=high
