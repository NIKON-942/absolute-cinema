<!doctype html>
<html lang="en" class="bg-cinema-black">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/frog-head.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AbsoluteCinema — online cinema: thousands of movies, one subscription." />
    <meta name="theme-color" content="#0b0c10" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('ac_theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark'
          ? saved : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f7f8fc' : '#0b0c10';
      })();
    </script>
    <title>AbsoluteCinema</title>
    <style>
      /* Match the initial theme before the stylesheet loads. */
      html, body { margin: 0; background: #0b0c10; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f7f8fc; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
